services:
  backend:
    build: ./mern-demo
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}

  frontend:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: mern-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend